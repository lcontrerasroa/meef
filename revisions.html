<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Révisions — Phonologie</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .intro { background: #eef3fb; border: 1px solid #b9cbe6; border-radius: 8px; padding: .9rem 1.1rem; margin-bottom: 1.2rem; font-size: .95rem; }
    .section-title { font-size: 1.15rem; color: var(--primary); margin: 1.8rem 0 .3rem; }
    .section-instr { color: var(--muted); font-size: .92rem; margin-bottom: .8rem; }
    .item { background: white; border: 1px solid var(--border); border-radius: 10px; padding: 1rem 1.2rem; margin-bottom: .8rem; }
    .item.done-ok { border-left: 5px solid var(--success); }
    .item.done-ko { border-left: 5px solid var(--accent); }
    .item.done-mid { border-left: 5px solid #e0a800; }
    .item-prompt { font-size: 1.02rem; margin-bottom: .6rem; }
    .item-prompt .big { font-size: 1.35rem; font-weight: 700; color: var(--primary); }
    .ipa, .item input.text-in, .option-btn, .cls-word { font-family: 'Noto Sans', 'DejaVu Sans', 'Segoe UI', sans-serif; }
    .audio-row { display: flex; align-items: center; gap: .5rem; margin: .2rem 0 .6rem; flex-wrap: wrap; }
    .audio-row audio { height: 34px; max-width: 100%; }
    .audio-tag { font-size: .75rem; color: var(--muted); }
    .text-row { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
    .text-in { flex: 1; min-width: 12rem; font-size: 1.15rem; padding: .45rem .7rem; border: 2px solid var(--border); border-radius: 6px; }
    .text-in:focus { outline: none; border-color: var(--primary); }
    .kb-toggle { font-size: .85rem; }
    .ipa-kb { display: none; }
    .ipa-kb.open { display: block; }
    .kb-section-title { font-size: .68rem; text-transform: uppercase; color: var(--muted); letter-spacing: .06em; margin: .2rem 0 .1rem; }
    .multi-opt { display: flex; align-items: center; gap: .6rem; padding: .45rem .8rem; border: 2px solid var(--border); border-radius: 6px; margin-bottom: .4rem; cursor: pointer; background: white; }
    .multi-opt input { width: 1.1rem; height: 1.1rem; }
    .multi-opt.correct { border-color: var(--success); background: #d1e7dd; }
    .multi-opt.wrong { border-color: var(--accent); background: #f8d7da; }
    .multi-opt.missed { border-color: var(--success); border-style: dashed; }
    .cls-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(13rem, 1fr)); gap: .4rem .8rem; }
    .cls-row { display: flex; align-items: center; justify-content: space-between; gap: .5rem; padding: .3rem .5rem; border-radius: 6px; border: 1px solid var(--border); }
    .cls-row select { font-size: .9rem; padding: .2rem; max-width: 9rem; }
    .cls-row.correct { background: #d1e7dd; border-color: var(--success); }
    .cls-row.wrong { background: #f8d7da; border-color: var(--accent); }
    .cls-fix { font-size: .78rem; color: var(--accent); }
    .expected { margin-top: .3rem; font-size: .92rem; }
    .mid-text { color: #b58100; font-weight: 700; }
    .check-row { margin-top: .7rem; display: flex; gap: .5rem; flex-wrap: wrap; }
    .sticky-score { position: sticky; top: 0; z-index: 5; background: var(--light); padding: .5rem 0 .2rem; }
    .score-line { display: flex; justify-content: space-between; font-size: .85rem; color: var(--muted); margin-bottom: .3rem; }
    .credits { font-size: .75rem; color: var(--muted); margin-top: 2rem; border-top: 1px solid var(--border); padding-top: .6rem; }
    @media (max-width: 560px) { .container { padding: 0 .8rem; } .item { padding: .9rem .8rem; } }
  </style>
</head>
<body>
  <header>
    <a href="index.html">← Accueil</a>
    <h1 id="ex-title">Chargement…</h1>
    <span id="ex-td" class="badge" style="background:#ffe0ec;color:#7a0f3a"></span>
  </header>

  <div class="container">
    <div class="sticky-score">
      <div class="score-line"><span id="answered-line"></span><span id="score-line"></span></div>
      <div class="progress-bar" style="margin-bottom:.4rem"><div class="progress-fill" id="progress" style="width:0%"></div></div>
    </div>
    <div id="intro"></div>
    <div id="sections"></div>
    <div id="final" class="score-box" style="display:none; margin-top:1.5rem">
      <h2>Résultat</h2>
      <div class="score-number" id="final-num"></div>
      <div class="score-label" id="final-label"></div>
      <div class="nav-row" style="justify-content:center">
        <button class="btn btn-primary" onclick="location.reload()">Recommencer</button>
        <a href="index.html" class="btn btn-outline">Accueil</a>
      </div>
    </div>
    <div id="credits" class="credits"></div>
  </div>

<script>
const KEYBOARDS = {
  ipa: [
    { label: 'Voyelles brèves', keys: ['ɪ','e','æ','ɒ','ʊ','ʌ','ə'] },
    { label: 'Voyelles longues', keys: ['iː','ɑː','ɔː','ɜː','uː'] },
    { label: 'Diphtongues', keys: ['eɪ','aɪ','ɔɪ','əʊ','aʊ','ɪə','eə','ʊə','oʊ'] },
    { label: 'Consonnes', keys: ['θ','ð','ʃ','ʒ','tʃ','dʒ','ŋ','ɡ','j'] },
    { label: 'Accents et longueur', keys: ['ˈ','ˌ','ː'] },
  ],
  narrow: [
    { label: 'Voyelles', keys: ['ɪ','e','æ','ɒ','ʊ','ʌ','ə','iː','ɑː','ɔː','ɜː','uː','eɪ','aɪ','ɔɪ','əʊ','aʊ','ɪə','eə','ʊə','oʊ'] },
    { label: 'Consonnes', keys: ['θ','ð','ʃ','ʒ','tʃ','dʒ','ŋ','ɡ','j','ɫ','ɱ'] },
    { label: 'Diacritiques', keys: ['ʰ','̚','̥','̩','̃','̬','ʲ','ʷ','‿'] },
    { label: 'Accents et longueur', keys: ['ˈ','ˌ','ː'] },
  ],
  stress: [
    { label: 'Schéma accentuel', keys: ['0','1','2'] },
  ],
};

const params = new URLSearchParams(location.search);
const dataFile = params.get('data') || 'data/rev-l2.json';
let DATA, ITEMS = [], RESULTS = [];

fetch(dataFile).then(r => r.json()).then(d => {
  DATA = d;
  document.title = d.title + ' — Révisions';
  document.getElementById('ex-title').textContent = d.title;
  document.getElementById('ex-td').textContent = d.td || '';
  if (d.intro) document.getElementById('intro').innerHTML = `<div class="intro">${d.intro}</div>`;
  const host = document.getElementById('sections');
  d.sections.forEach((sec, si) => {
    const s = document.createElement('div');
    s.innerHTML = `<h2 class="section-title">${sec.title}</h2>` +
      (sec.instructions ? `<p class="section-instr">${sec.instructions}</p>` : '');
    sec.items.forEach(it => {
      const idx = ITEMS.length;
      ITEMS.push(it);
      RESULTS.push(null);
      s.appendChild(renderItem(it, idx));
    });
    host.appendChild(s);
  });
  if (d.credits && d.credits.length) {
    document.getElementById('credits').innerHTML = '<b>Enregistrements</b> : Wikimedia Commons. ' +
      d.credits.map(c => `${c.file} (${c.author}, ${c.license})`).join(' ; ') + '.';
  }
  updateScore();
});

function audioHtml(it) {
  if (!it.audio) return '';
  const list = Array.isArray(it.audio) ? it.audio : [it.audio];
  // Wikimedia Commons : MP3 transcodé d'abord (Safari, iPhone), puis l'OGG d'origine
  const sources = src => {
    const m = src.match(/^(https:\/\/upload\.wikimedia\.org\/wikipedia\/commons\/)(.+\/([^\/]+\.ogg))$/);
    return m ? `<source src="${m[1]}transcoded/${m[2]}/${m[3]}.mp3" type="audio/mpeg"><source src="${src}" type="audio/ogg">`
             : `<source src="${src}">`;
  };
  return list.map(a => `<div class="audio-row"><audio controls preload="none">${sources(a.src)}</audio>` +
    (a.label ? `<span class="audio-tag">${a.label}</span>` : '') + `</div>`).join('');
}

function renderItem(it, idx) {
  const el = document.createElement('div');
  el.className = 'item';
  el.id = 'item-' + idx;
  let body = `<div class="item-prompt">${it.prompt}</div>` + audioHtml(it);
  if (it.type === 'qcm') {
    body += `<div class="options">` + it.options.map((o, j) =>
      `<button class="option-btn" onclick="pickQcm(${idx},${j})">${o}</button>`).join('') + `</div>`;
  } else if (it.type === 'multi') {
    body += it.options.map((o, j) =>
      `<label class="multi-opt" id="m-${idx}-${j}"><input type="checkbox"> <span>${o}</span></label>`).join('');
    body += `<div class="check-row"><button class="btn btn-primary" onclick="checkMulti(${idx})">Vérifier</button></div>`;
  } else if (it.type === 'text') {
    const kb = it.keyboard || 'ipa';
    body += `<div class="text-row">
        <input class="text-in" id="t-${idx}" autocomplete="off" autocapitalize="off" spellcheck="false"
          placeholder="${it.placeholder || ''}" ${kb === 'stress' ? 'inputmode="numeric"' : ''}
          onkeydown="if(event.key==='Enter')checkText(${idx})">
        <button class="btn btn-outline kb-toggle" onclick="toggleKb(${idx})">⌨ ${kb === 'stress' ? '0 1 2' : 'API'}</button>
        <button class="btn btn-primary" onclick="checkText(${idx})">Vérifier</button>
      </div>
      <div class="ipa-kb" id="kb-${idx}">${kbHtml(kb, idx)}</div>`;
  } else if (it.type === 'classify') {
    body += `<div class="cls-grid">` + it.words.map((w, j) =>
      `<div class="cls-row" id="c-${idx}-${j}"><span class="cls-word">${w.w}</span>
        <select><option value="">…</option>${it.categories.map(c => `<option>${c}</option>`).join('')}</select></div>`).join('') + `</div>`;
    body += `<div class="check-row"><button class="btn btn-primary" onclick="checkClassify(${idx})">Vérifier</button></div>`;
  }
  body += `<div class="feedback" id="fb-${idx}" style="display:none"></div>`;
  el.innerHTML = body;
  return el;
}

function kbHtml(kb, idx) {
  return KEYBOARDS[kb].map(sec =>
    `<div class="kb-section-title">${sec.label}</div><div class="ipa-row">` +
    sec.keys.map(k => `<button class="ipa-key" onmousedown="event.preventDefault()" onclick="typeKey(${idx}, this.dataset.k)" data-k="${k}">${/^[̀-ͯ]$/.test(k) ? '◌' + k : k}</button>`).join('') +
    `</div>`).join('') +
    `<div class="ipa-row"><button class="ipa-key delete-key" onmousedown="event.preventDefault()" onclick="backspace(${idx})">⌫ Effacer</button></div>`;
}

function toggleKb(idx) { document.getElementById('kb-' + idx).classList.toggle('open'); document.getElementById('t-' + idx).focus(); }

function typeKey(idx, k) {
  const inp = document.getElementById('t-' + idx);
  if (inp.disabled) return;
  const s = inp.selectionStart ?? inp.value.length, e = inp.selectionEnd ?? inp.value.length;
  inp.setRangeText(k, s, e, 'end');
  inp.focus();
}
function backspace(idx) {
  const inp = document.getElementById('t-' + idx);
  if (inp.disabled) return;
  const s = inp.selectionStart, e = inp.selectionEnd;
  if (s !== e) inp.setRangeText('', s, e, 'end');
  else if (s > 0) {
    // delete one grapheme including combining diacritics
    let cut = s - 1;
    while (cut > 0 && /[̀-ͯ]/.test(inp.value[cut])) cut--;
    inp.setRangeText('', cut, s, 'end');
  }
  inp.focus();
}

function norm(str, mode) {
  let s = (str || '').normalize('NFD').trim();
  if (mode === 'stress') return s.replace(/[^012]/g, '');
  s = s.replace(/[\/\[\]\s]/g, '')
       .replace(/[:ː]/g, 'ː')
       .replace(/g/g, 'ɡ')
       .replace(/['’`]/g, 'ˈ')
       .replace(/,/g, 'ˌ')
       .replace(/ɾ/g, 't̬'.normalize('NFD'))
       .replace(/ɚ/g, 'ər').replace(/ɝː?/g, 'ɜːr');
  return s.normalize('NFC');
}
const stripStress = s => s.replace(/[ˈˌ]/g, '');

function finish(idx, status, html) {
  RESULTS[idx] = status === 'ok' ? 1 : status === 'mid' ? 0.5 : 0;
  const el = document.getElementById('item-' + idx);
  el.classList.add(status === 'ok' ? 'done-ok' : status === 'mid' ? 'done-mid' : 'done-ko');
  const fb = document.getElementById('fb-' + idx);
  fb.style.display = 'block';
  fb.className = 'feedback ' + (status === 'ok' ? 'ok' : 'ko');
  const head = status === 'ok' ? '<span class="ok-text">✓ Correct.</span> '
    : status === 'mid' ? '<span class="mid-text">≈ Presque.</span> '
    : '<span class="ko-text">✗ Pas tout à fait.</span> ';
  fb.innerHTML = head + html;
  updateScore();
}

function pickQcm(idx, j) {
  if (RESULTS[idx] !== null) return;
  const it = ITEMS[idx];
  const btns = document.querySelectorAll(`#item-${idx} .option-btn`);
  btns.forEach((b, k) => { b.disabled = true; if (k === it.answer) b.classList.add('correct'); else if (k === j) b.classList.add('wrong'); });
  finish(idx, j === it.answer ? 'ok' : 'ko', it.feedback || '');
}

function checkMulti(idx) {
  if (RESULTS[idx] !== null) return;
  const it = ITEMS[idx];
  let errors = 0;
  it.options.forEach((o, j) => {
    const lab = document.getElementById(`m-${idx}-${j}`);
    const box = lab.querySelector('input');
    box.disabled = true;
    const should = it.answers.includes(j);
    if (box.checked && should) lab.classList.add('correct');
    else if (box.checked && !should) { lab.classList.add('wrong'); errors++; }
    else if (!box.checked && should) { lab.classList.add('missed'); errors++; }
  });
  document.querySelector(`#item-${idx} .check-row`).style.display = 'none';
  finish(idx, errors === 0 ? 'ok' : errors === 1 ? 'mid' : 'ko', it.feedback || '');
}

function checkText(idx) {
  if (RESULTS[idx] !== null) return;
  const it = ITEMS[idx];
  const inp = document.getElementById('t-' + idx);
  if (!inp.value.trim()) { inp.focus(); return; }
  const mode = it.keyboard === 'stress' ? 'stress' : 'ipa';
  const user = norm(inp.value, mode);
  const acc = it.accept.map(a => norm(a, mode));
  inp.disabled = true;
  document.getElementById('kb-' + idx).classList.remove('open');
  let status = 'ko', note = '';
  if (acc.includes(user)) status = 'ok';
  else if (mode === 'ipa' && acc.map(stripStress).includes(stripStress(user))) {
    status = 'mid'; note = 'Les sons sont justes, mais vérifiez la place des accents. ';
  }
  const expected = status === 'ok' ? '' :
    `<div class="expected">Réponse attendue : <span class="ipa"><b>${it.show || it.accept[0]}</b></span></div>`;
  finish(idx, status, note + (it.feedback || '') + expected);
}

function checkClassify(idx) {
  if (RESULTS[idx] !== null) return;
  const it = ITEMS[idx];
  let good = 0;
  it.words.forEach((w, j) => {
    const row = document.getElementById(`c-${idx}-${j}`);
    const sel = row.querySelector('select');
    sel.disabled = true;
    if (sel.value === w.cat) { row.classList.add('correct'); good++; }
    else { row.classList.add('wrong'); row.insertAdjacentHTML('beforeend', `<span class="cls-fix">→ ${w.cat}</span>`); }
  });
  document.querySelector(`#item-${idx} .check-row`).style.display = 'none';
  const ratio = good / it.words.length;
  finish(idx, ratio === 1 ? 'ok' : ratio >= 0.7 ? 'mid' : 'ko',
    `${good} / ${it.words.length} bien classés. ` + (it.feedback || ''));
}

function updateScore() {
  const n = ITEMS.length, done = RESULTS.filter(r => r !== null).length;
  const pts = RESULTS.reduce((a, r) => a + (r || 0), 0);
  document.getElementById('progress').style.width = Math.round(done / n * 100) + '%';
  document.getElementById('answered-line').textContent = `${done} / ${n} questions faites`;
  document.getElementById('score-line').textContent = `Score : ${pts} / ${done}`;
  if (done === n) {
    const f = document.getElementById('final');
    f.style.display = 'block';
    const pct = Math.round(pts / n * 100);
    document.getElementById('final-num').textContent = `${pts} / ${n}`;
    document.getElementById('final-label').textContent =
      pct >= 80 ? '🎉 Excellent, vous êtes prêts pour l\'examen.' : pct >= 60 ? '👍 Bien. Reprenez les questions en rouge.' : '📚 À retravailler : relisez le cours puis recommencez.';
  }
}
</script>
</body>
</html>
